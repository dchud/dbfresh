# Copyable root config. Copy to config.yaml, adjust the
# sources and checks for your environment, and supply the ${VAR} secrets
# below via the environment or a gitignored per-user .env.

version: 1

store: # optional; observation history. A bare string is shorthand for { path }.
  path: ./dbfresh.db
  retain_days: 400

calendar: # optional; enables weekend/holiday-aware expectations
  timezone: America/New_York
  workdays: [mon, tue, wed, thu, fri]
  holidays: { country: US, subdivision: null, extra: [], remove: [] }

sources:
  warehouse:
    type: sqlserver
    url: ${MSSQL_URL} # sqlserver://reader:pw@host:1433/WarehouseDB
    timeout: 30
    timezone: America/New_York # interpret naive timestamps as this tz (default UTC)
  lakehouse:
    type: databricks
    host: ${DATABRICKS_HOST}
    http_path: ${DATABRICKS_HTTP_PATH}
    token: ${DATABRICKS_TOKEN} # auth_type: pat (default); or oauth_m2m:
    # auth_type: oauth_m2m
    # client_id: ${DATABRICKS_CLIENT_ID}
    # client_secret: ${DATABRICKS_CLIENT_SECRET}

defaults: # merged into every check when absent; supports
  severity: error #   severity, calendar, where, allow_empty, skip_off_schedule

# check_sets: named, parameterized check batteries -- with: supplies
# parameter defaults, a table's own with: overrides one key at a time.
# {{ name }} occupying an entire scalar node is replaced by that
# parameter's full value (any type); embedded in a longer string, it
# interpolates as text and needs a scalar parameter.
check_sets:
  standard:
    with:
      rows: { vs_previous: { baseline: previous, min_ratio: 0.8, max_ratio: 1.2 } }
      max_lag: 26h
    checks:
      - metric: schema
        expect: { unchanged: true }
      - metric: row_count
        expect: "{{ rows }}"
      - metric: freshness
        column: "{{ ts_column }}"
        expect: { max_lag: "{{ max_lag }}" }
        calendar: business

# tables: groups checks that share a source/object, stating both once
# instead of repeating them on every check nested under the entry.
tables:
  - source: warehouse
    object: dbo.fct_sales
    checks:
      - id: sales_amount_nonneg # optional stable id
        assert: "amount >= 0"

      - metric: schema # table-level shape check
        expect: { unchanged: true } # fail if columns/types drift from last run

      - metric: row_count
        expect: { between: [10000, 500000] }
        by_weekday:
          mon: { between: [0, 500000] }
          sat: { max: 100 }
          sun: { max: 100 }
        on_holiday: { max: 100 }

      - metric: freshness
        column: modified_at
        freshness_source: column # or describe_history / describe_detail (Databricks tables)
        expect: { max_lag: 26h }
        calendar: business

  # use: pulls in the standard battery; with: supplies the parameters it
  # needs (ts_column has no set-level default, so every user must supply
  # it). rows and max_lag fall through to the set's own defaults.
  - source: warehouse
    object: dbo.dim_customer
    use: standard
    with: { ts_column: modified_at }

  # skip: drops the freshness item (a slowly-changing reference table has
  # no meaningful lag bound), so ts_column is never needed here.
  - source: warehouse
    object: dbo.ref_currency
    use: standard
    skip: [freshness]
    with: { rows: { between: [1, 500] } }

checks:
  - source: lakehouse
    object: main.gold.customer_360
    metric: null_rate
    column: email
    expect: { max: 0.01 }

  - source: lakehouse
    object: main.gold.customer_360
    metric: row_count
    expect:
      vs_previous:
        {
          baseline: last_same_weekday,
          min_ratio: 0.5,
          max_ratio: 2.0,
          on_missing: pass,
        }
